[audio]
enable_sounds = true
notification_sound = "/usr/share/noctalia/assets/sounds/notification.wav"
volume_change_sound = "/usr/share/noctalia/assets/sounds/volume-change.wav"

[bar.default]
background_opacity = 0.89999997988343239
center = [ "date", "clock", "weather", "notifications", "bar", "todo" ]
contact_shadow = true
end = [
    "toggle_osk",
    "clipboard",
    "network",
    "bluetooth",
    "input_volume",
    "volume",
    "brightness",
    "battery",
    "power_profile",
    "caffeine",
    "control-center",
    "session"
]
start = [ "toggle_app_drawer", "launcher", "wallpaper", "workspaces", "active_window", "media", "audio_visualizer", "tray" ]
widget_spacing = 8

[desktop_widgets]
schema_version = 2
widget_order = [
    "desktop-widget-0000000000000001",
    "desktop-widget-0000000000000002",
    "desktop-widget-0000000000000003",
    "desktop-widget-0000000000000004",
    "desktop-widget-0000000000000005"
]

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget.desktop-widget-0000000000000001]
    box_height = 288.0
    box_width = 288.0
    cx = 544.0
    cy = 280.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000001.settings]
        background = false
        primary_color = "primary"
        secondary_color = "#F0C6C6"
        visualization_mode = "all"

    [desktop_widgets.widget.desktop-widget-0000000000000002]
