    rotation = 0.0
    type = "sysmon"

        [desktop_widgets.widget.desktop-widget-0000000000000004.settings]
        background = true
        stat = "ram_pct"
        stat2 = "gpu_vram"

    [desktop_widgets.widget.desktop-widget-0000000000000005]
    box_height = 288.0
    box_width = 288.0
    cx = 3296.0
    cy = 280.0
    output = "HDMI-A-1"
    rotation = 0.0
    type = "fancy_audio_visualizer"

        [desktop_widgets.widget.desktop-widget-0000000000000005.settings]
        background = false
        primary_color = "primary"
        secondary_color = "#F0C6C6"
        visualization_mode = "all"

[dock]
enabled = false
icon_size = 40
position = "left"
show_dots = true

[idle]
pre_action_fade_seconds = 10

[keybinds]
down = [ "Down", "Ctrl+n" ]
up = [ "Up", "Ctrl+p" ]
validate = [ "Return", "KP_Enter", "space", "Ctrl+y" ]

[location]
address = "Iowa City, USA"

[lockscreen_widgets]
