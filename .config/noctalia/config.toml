[plugin_settings."kenn/keybind-cheatsheet"]
hyprland_parser = "lua"

[plugins]
enabled = [ "noctalia/timer", "nightwatch75/todo", "blackbartblues/keymap" ]

[shell]
app_icon_color = "on_surface_variant"
font_family = "VictorMono Nerd Font"
polkit_agent = true
telemetry_enabled = true

    [shell.panel]
    transparency_mode = "soft"

    [shell.screen_corners]
    enabled = true

[theme]
builtin = "Catppuccin"
community_palette = "Catppuccin Macchiato Mauve"
source = "community"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4", "kcolorscheme" ]
    community_ids = [ "zen-browser", "papirus-icons", "steam" ]

[wallpaper]
directory = "/home/jalhamer/.config/wallpapers/fractalpuccin/macchiato"
directory_dark = "/home/jalhamer/.config/wallpapers/fractalpuccin/macchiato"
directory_light = "/home/jalhamer/.config/wallpapers/fractalpuccin/latte"
transition_on_startup = true

    [wallpaper.automation]
    enabled = true
    interval_seconds = 1200

    [wallpaper.default]
    path = "/home/jalhamer/.config/wallpapers/fractalpuccin/macchiato/newton.png"

    [wallpaper.last]
    path = "/home/jalhamer/.config/wallpapers/fractalpuccin/macchiato/newton.png"

    [wallpaper.monitors.HDMI-A-1]
    path = "/home/jalhamer/.config/wallpapers/fractalpuccin/macchiato/newton.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/jalhamer/.config/wallpapers/fractalpuccin/macchiato/newton.png"

[widget.bar]
type = "noctalia/timer:bar"

[widget.todo]
type = "nightwatch75/todo:todo"

[widget.toggle_app_drawer]
glyph = "apps"
tooltip = "Toggle app drawer"
type = "custom_button"

    [widget.toggle_app_drawer.actions]
    left = "exec $XDG_CONFIG_HOME/waybar/scripts/toggle_nwg-drawer.sh"

[widget.toggle_osk]
glyph = "keyboard"
tooltip = "Toggle the on-screen keyboard"
type = "custom_button"

    [widget.toggle_osk.actions]
    left = "exec $XDG_CONFIG_HOME/waybar/scripts/toggle_wvkbd.sh"
